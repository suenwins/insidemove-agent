name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository
# activity, and the only warning is an email that is easy to miss. This job
# touches the repo every Sunday so the daily scan never silently stops.
#
# It is not busywork: without it, the most likely failure mode of this whole
# system is that it quietly stops running two months from now and you find out
# when you notice you have not had an alert in a while.
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record a heartbeat
        run: |
          mkdir -p .github
          date -u +"last keepalive: %Y-%m-%dT%H:%M:%SZ" > .github/HEARTBEAT
          git config user.name  "insidemove-bot"
          git config user.email "insidemove-bot@users.noreply.github.com"
          git add .github/HEARTBEAT
          git diff --staged --quiet || git commit -m "chore: keepalive heartbeat"
          git push
